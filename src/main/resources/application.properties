spring.application.name=tp10-ventas-api
spring.datasource.url=jdbc:mysql://localhost:3306/tp10_ventas?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Jujuy
spring.datasource.username=root
spring.datasource.password=toor
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# ---- Reglas de negocio de ventas (configurables) ----
ventas.contado.descuento=0.10
ventas.financiada.recargo=0.15
ventas.financiada.cuotas-por-defecto=6

# ---- Documentación de la API (Swagger UI) ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
